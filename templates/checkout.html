{% extends "base.html" %}

{% block content %}

<section class="page-banner">
    <h1>Checkout</h1>
</section>

<div class="page-content">

    <form method="POST">

        {{ form.hidden_tag() }}

        {{ form.name.label }}
        {{ form.name(class="form-control") }}

        <label>Phone Number</label>
        {{ form.phone(class="form-control") }}

        <br>
        
        <label>Address</label>
        {{ form.address(class="form-control", rows="4") }}

        <br><br>

        {{ form.submit(class="btn") }}

    </form>

</div>

{% endblock %}
