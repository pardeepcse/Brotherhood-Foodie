{% extends "base.html" %}

{% block content %}

<section class="gallery">

    <h2>Food Gallery</h2>

    <div class="gallery-container">

        {% for image in images %}

        <img
            src="{{ url_for('static', filename='uploads/gallery/' + image.image) }}"
            alt="{{ image.title }}"
        >

        {% endfor %}

    </div>

</section>

{% endblock %}
