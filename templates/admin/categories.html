{% extends "admin/admin_base.html" %}

{% block content %}

<h2>All Categories</h2>

<table border="1" cellpadding="10">

    <tr>
        <th>ID</th>
        <th>Image</th>
        <th>Name</th>
        <th>Description</th>
        <th>Action</th>
    </tr>

    <tbody>
        {% for category in categories %}
        <tr>

            <td>{{ category.id }}</td>

            <td>
                <img src="{{ url_for('static', filename='uploads/categories/' + category.image) }}" width="100">
            </td>

            <td>{{ category.name }}</td>

            <td>{{ category.description }}</td>

            <td class="action-buttons">

                <a href="{{ url_for('edit_category', category_id=category.id) }}" class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a href="{{ url_for('delete_category', category_id=category.id) }}" class="btn btn-danger btn-sm">
                    Delete
                </a>

            </td>

        </tr>
        {% endfor %}
    </tbody>

</table>

{% endblock %}
